services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algorixe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algorixe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-algorixe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 to avoid clashing with a local PostgreSQL on 5432.
      # Internal service-to-service connections still use db:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algorixe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Exec-form single string avoids YAML folded-scalar newline pitfalls that
    # would otherwise split the gunicorn args (causing a 127.0.0.1 default bind).
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.cli seed && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 --timeout 120

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    healthcheck:
      # 127.0.0.1 (not localhost) — image's wget prefers IPv6 ::1, but nginx listens IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
