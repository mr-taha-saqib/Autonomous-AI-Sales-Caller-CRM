# Reverse proxy: routes /api and /docs to FastAPI, everything else to Next.js.
upstream api_backend  { server api:8000; }
upstream web_frontend { server web:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # API + interactive docs + health + Twilio webhooks
    location ~ ^/(api|docs|redoc|openapi.json|health) {
        proxy_pass         http://api_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass        http://web_frontend;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
